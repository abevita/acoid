name: CI

on:
  push:
    branches: ["main", "lang/dart"]
  pull_request:
    branches: ["main", "lang/dart"]

jobs:
  # ── Dart ────────────────────────────────────────────────────────────────────
  test-dart:
    name: Test (Dart ${{ matrix.dart }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dart: ["3.0", "3.5", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart ${{ matrix.dart }}
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart }}

      - name: Get dependencies
        working-directory: dart
        run: dart pub get

      - name: Test
        working-directory: dart
        run: dart test
