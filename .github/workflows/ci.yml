name: CI

on:
  push:
    branches: ["main", "lang/rust"]
  pull_request:
    branches: ["main", "lang/rust"]

jobs:
  # ── Rust ────────────────────────────────────────────────────────────────────
  test-rust:
    name: Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        working-directory: rust
        run: cargo test
